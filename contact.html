<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Pet Adoption Center</title>
    <link rel="stylesheet" href = "style.css">
</head>    

<body>
    <h1>Contact Our Pet Adoption Center</h1>

    <p>Interested in adopting a pet? Fill out the form below
        and we will contact you with more information.
    </p>

    <h2>Adoption Inquiry Form</h2>

    <form>

        <label for="name">Full name:</label>
        <input type="text" id="name" name="name">

        <label for="contactMethod">How would you like us to contact you?</label>

        <select id="contactMethod" name="contactMethod">
            <option id="selectOne" value="">Select One</option>
            <option id="emailOption" value="email">Email</option>
            <option id="phoneOption" value="phone">Phone</option>
        </select>

        <div id="emailInput" style="display: none;">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">
        </div>

        <div id="phoneInput" style="display: none;">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <label for="pet">Which pet are you interested in?</label>
        <select id="pet" name="pet">
            <option value="buddy">Buddy</option>
            <option value="luna">Luna</option>
            <option value="max">Max</option>
            <option value="milo">Milo</option>
        </select>

        <label for="message">Tell us why you would like to adopt:</label>
        <textarea id="message" name="message" rows="6" cols="50"></textarea>

        <input type="submit" value="Submit Application">

    </form>

   <h2>Navigation</h2>

   <p>
    <a href="index.html">Home Page</a>
   </p>

   <p>
    <a href="adoption.html">Available Pets</a>
   </p>

    <p>
     <a href="gallery.html">Pet Gallery</a>
    </p>

    <script src="contact.js"></script>
</body>

</html>
